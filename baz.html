function buildQuiz() {
    const form = document.getElementById('quizForm');
    let questionCounter = 0;
    
    quizData.forEach((item, index) => {
        if (item.type === 'h2') {
            const header = document.createElement('h2');
            header.textContent = item.text;
            form.appendChild(header);
            return;
        }

        questionCounter++;
        const questionBlock = document.createElement('div');
        questionBlock.className = 'question-block';
        questionBlock.id = `q-block-${questionCounter}`;

        const questionText = document.createElement('p');
        questionText.textContent = `${questionCounter}. ${item.q}`;
        questionBlock.appendChild(questionText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        if (item.type === '单选题') {
            const optionChars = ['A', 'B', 'C', 'D', 'E'];
            item.o.forEach((option, i) => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `q${questionCounter}`;
                input.value = optionChars[i];
                label.appendChild(input);
                label.append(` ${optionChars[i]}. ${option}`);
                optionsDiv.appendChild(label);
            });
        } else if (item.type === '多选题') {
            const optionChars = ['A', 'B', 'C', 'D', 'E'];
            item.o.forEach((option, i) => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.name = `q${questionCounter}`;
                input.value = optionChars[i];
                label.appendChild(input);
                label.append(` ${optionChars[i]}. ${option}`);
                optionsDiv.appendChild(label);
            });
        } else if (item.type === '判断题') {
            const options = [{text:'正确', val: 'A'}, {text:'错误', val:'B'}];
            options.forEach(opt => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `q${questionCounter}`;
                input.value = opt.val;
                label.appendChild(input);
                label.append(` ${opt.text}`);
                optionsDiv.appendChild(label);
            });
        }
        
        questionBlock.appendChild(optionsDiv);

        const resultDiv = document.createElement('div');
        resultDiv.className = 'result';
        resultDiv.id = `result-${questionCounter}`;
        const correctAnswer = (item.type === '判断题') ? (item.a === 'A' ? '正确' : '错误') : item.a;
        resultDiv.innerHTML = `正确答案: ${correctAnswer}`;
        questionBlock.appendChild(resultDiv);

        form.appendChild(questionBlock);
    });
}

function checkAnswers() {
    let score = 0;
    let questionCounter = 0;
    const totalQuestions = quizData.filter(item => item.type !== 'h2').length;

    quizData.forEach((item, index) => {
        if (item.type === 'h2') return;

        questionCounter++;
        const resultDiv = document.getElementById(`result-${questionCounter}`);
        const questionBlock = document.getElementById(`q-block-${questionCounter}`);
        let userAnswer;

        if (item.type === '单选题' || item.type === '判断题') {
            const selectedOption = document.querySelector(`input[name="q${questionCounter}"]:checked`);
            userAnswer = selectedOption ? selectedOption.value : '';
        } else if (item.type === '多选题') {
            const selectedOptions = document.querySelectorAll(`input[name="q${questionCounter}"]:checked`);
            userAnswer = Array.from(selectedOptions).map(cb => cb.value).sort().join('');
        }

        resultDiv.style.display = 'block';
        if (userAnswer === item.a) {
            score++;
            questionBlock.style.borderColor = '#28a745';
            resultDiv.className = 'result correct';
        } else {
            questionBlock.style.borderColor = '#dc3545';
            resultDiv.className = 'result incorrect';
        }
    });

    const scoreCard = document.getElementById('score-card');
    scoreCard.textContent = `您的总分: ${score} / ${totalQuestions}`;
    scoreCard.style.display = 'block';
    window.scrollTo(0, 0); // Scroll to top to see score
}

// Build the quiz on page load
window.onload = buildQuiz;

</script>
